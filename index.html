<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Live2dV3 Demo</title>
    <link
      rel="shortcut icon"
      href="https://lalaki.cn/favicon.ico?v=1.0.0"
      type="image/x-icon"
    />
  </head>
  <body>
    <h1>点击她还会发出声音哦</h1>
    <div id="live2d"></div>
    <script src="https://fastly.jsdelivr.net/npm/pixi.js@6.5.8/dist/browser/pixi.min.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/pixi.js-legacy@6.5.8/dist/browser/pixi-legacy.min.js"></script>
    <script src="./live2dcubismcore.min.js"></script>
    <script src="./live2dv3.min.js"></script>
    <script>
      new l2dViewer({
        el: document.getElementById("live2d"),
        basePath:
          "https://fastly.jsdelivr.net/gh/lalakii/Live2dV3@master/assets",
        modelName: "biaoqiang_3",
        width: 1200,
        height: 900,
        sounds: [
          "https://fastly.jsdelivr.net/gh/lalakii/Live2dV3@master/assets/biaoqiang_3/sounds/demo.mp3",
        ],
      });
    </script>
  </body>
</html>
